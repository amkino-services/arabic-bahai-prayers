<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">

  <!-- Outer compass ring -->
  <circle
    cx="24"
    cy="24"
    r="16.5"
    fill="none"
    stroke="#0e6f88"
    stroke-width="3"
  />

  <!-- Four compass marks -->
  <path
    d="M24 4.5V9
       M24 39V43.5
       M4.5 24H9
       M39 24H43.5"
    fill="none"
    stroke="#0e6f88"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!--
    Continuous compass needle.
    Northeast half = solid teal.
  -->
  <path
    d="M21.2 21.2
       L35 13
       L26.8 26.8
       Z"
    fill="#0e6f88"
    stroke="#0e6f88"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!--
    Southwest half = white interior
    with teal outline.
  -->
  <path
    d="M21.2 21.2
       L13 35
       L26.8 26.8
       Z"
    fill="#FFFFFF"
    stroke="#0e6f88"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Center hub -->
  <circle
    cx="24"
    cy="24"
    r="3.4"
    fill="#0e6f88"
  />

  <!-- White center ring -->
  <circle
    cx="24"
    cy="24"
    r="2.1"
    fill="#FFFFFF"
  />

</svg>
