<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131">
  <defs>
    <radialGradient id="paper-tone" cx="50%" cy="46%" r="78%">
      <stop offset="0" stop-color="#eeddbb"/>
      <stop offset="58%" stop-color="#e7d0a4"/>
      <stop offset="84%" stop-color="#c99d60"/>
      <stop offset="100%" stop-color="#71451f"/>
    </radialGradient>
    <radialGradient id="worn-edge" cx="50%" cy="48%" r="74%">
      <stop offset="0" stop-color="#fff4d9" stop-opacity=".20"/>
      <stop offset="60%" stop-color="#fff0d0" stop-opacity=".04"/>
      <stop offset="82%" stop-color="#835627" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#3d210e" stop-opacity=".48"/>
    </radialGradient>
    <filter id="mottling" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .017" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope=".27" intercept=".36"/>
        <feFuncG type="linear" slope=".22" intercept=".27"/>
        <feFuncB type="linear" slope=".14" intercept=".15"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".32 .78" numOctaves="2" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="1131" fill="url(#paper-tone)"/>
  <rect width="1600" height="1131" filter="url(#mottling)" opacity=".19"/>
  <rect width="1600" height="1131" filter="url(#fibers)" opacity=".10"/>
  <rect width="1600" height="1131" fill="url(#worn-edge)"/>
</svg>